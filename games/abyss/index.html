  <div class="app-shell">
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark"><svg class="icon"><use href="#i-energy"/></svg></span>
        <span class="brand-name">深渊回响<small>ABYSS ECHO</small></span>
      </div>
      <div class="hud" id="hud">
        <span class="hud-item hp" title="生命"><svg class="icon"><use href="#i-heart"/></svg><b id="hud-hp">0</b><i id="hud-maxhp">/0</i></span>
        <span class="hud-item gold" title="金币"><svg class="icon"><use href="#i-coin"/></svg><b id="hud-gold">0</b></span>
        <span class="hud-item place" title="章节与层数"><svg class="icon"><use href="#i-map"/></svg><b id="hud-place">第 1 章</b><i id="hud-chapter">· 回响航母</i><i id="hud-floor">0/15</i></span>
      </div>
      <nav class="main-nav" aria-label="游戏导航">
        <button class="nav-button" data-view="map"><svg class="icon"><use href="#i-map"/></svg><span class="nav-label">地图</span></button>
        <button class="nav-button" data-panel="deck"><svg class="icon"><use href="#i-deck"/></svg><span class="nav-label">牌组</span></button>
        <button class="nav-button" data-panel="relics"><svg class="icon"><use href="#i-book"/></svg><span class="nav-label">图鉴</span></button>
        <button class="icon-button" data-panel="help" aria-label="玩法说明" title="玩法说明"><svg class="icon"><use href="#i-help"/></svg></button>
        <button class="icon-button" data-panel="save" aria-label="存档与设置" title="存档与设置"><svg class="icon"><use href="#i-save"/></svg></button>
      </nav>
    </header>

    <main class="stage">
      <section class="view view-map" id="view-map" aria-label="章节地图">
        <div class="map-head">
          <div class="map-hero">
            <p class="eyebrow" id="chapter-subtitle">THE ECHO CARRIER</p>
            <h1 id="chapter-name">回响航母</h1>
            <p class="map-intro" id="chapter-intro"></p>
          </div>
          <ol class="map-nodes" id="map-nodes"></ol>
        </div>
      </section>

      <section class="view view-battle" id="view-battle" hidden aria-label="战斗">
        <div class="battle-top">
          <div class="enemies" id="enemies"></div>
        </div>
        <div class="battle-mid">
          <div class="player-panel">
            <div class="player-status" id="player-status"></div>
            <div class="battle-log" id="battle-log" role="log" aria-live="polite" tabindex="0" aria-label="战斗日志"></div>
          </div>
          <div class="piles">
            <button class="pile" id="pile-draw" data-panel="pile-draw"><b id="draw-count">0</b><span>抽牌堆</span></button>
            <button class="pile" id="pile-discard" data-panel="pile-discard"><b id="discard-count">0</b><span>弃牌堆</span></button>
            <button class="pile" id="pile-exhaust" data-panel="pile-exhaust"><b id="exhaust-count">0</b><span>消耗堆</span></button>
          </div>
        </div>
        <div class="battle-bottom">
          <div class="energy" id="energy"><svg class="icon"><use href="#i-energy"/></svg><b id="energy-value">3</b><i id="energy-max">/3</i></div>
          <div class="hand" id="hand" aria-label="手牌"></div>
          <div class="battle-actions">
            <div class="potions" id="potions" aria-label="药水"></div>
            <button class="button primary" id="end-turn">结束回合<kbd>E</kbd></button>
          </div>
        </div>
      </section>
    </main>

    <div class="overlay" id="overlay" hidden>
      <div class="overlay-card" id="overlay-card" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
        <button class="overlay-close icon-button" id="overlay-close" aria-label="关闭"><svg class="icon"><use href="#i-close"/></svg></button>
        <div id="overlay-body"></div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <noscript><div class="noscript">请开启 JavaScript 后再开始这次攀登。</div></noscript>
</body>
</html>
